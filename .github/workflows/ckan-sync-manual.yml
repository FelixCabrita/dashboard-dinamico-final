name: CKAN Sync - Manual

# Solo ejecución manual
on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'Recurso a sincronizar'
        required: true
        type: choice
        options:
          - 'all'
          - 'miradores'
          - 'aparcamientos'
          - 'puntos_interes'
      force:
        description: 'Forzar sincronización (ignorar caché)'
        required: false
        type: boolean
        default: false

jobs:
  sync-specific-resource:
    name: Sincronizar Recurso Específico
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, sqlite3, pdo_sqlite, curl

      - name: 📦 Instalar dependencias
        run: composer install --prefer-dist --no-progress

      - name: 🗺️ Instalar GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
          ogr2ogr --version

      - name: 📁 Crear directorios
        run: |
          mkdir -p writable/ckan_sync/{sqlite,geojson,temp/downloads,logs}
          chmod -R 755 writable/ckan_sync

      - name: ⚙️ Configurar environment
        run: |
          cp env .env 2>/dev/null || echo "CI=true" > .env
          echo "CKAN_API_TOKEN=${{ secrets.CKAN_API_TOKEN }}" >> .env
          echo "CKAN_BASE_URL=${{ secrets.CKAN_BASE_URL }}" >> .env

      - name: 🔄 Sincronizar recurso
        run: |
          if [ "${{ github.event.inputs.resource }}" = "all" ]; then
            echo "🔄 Sincronizando TODOS los recursos..."
            php spark ckan:sync ${{ github.event.inputs.force && '--force' || '' }}
          else
            echo "🔄 Sincronizando recurso: ${{ github.event.inputs.resource }}"
            php spark ckan:sync --resource=${{ github.event.inputs.resource }} ${{ github.event.inputs.force && '--force' || '' }}
          fi

      - name: 📊 Mostrar estadísticas
        if: always()
        run: |
          echo "### 📊 Resultado de Sincronización" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Recurso:** ${{ github.event.inputs.resource }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Forzar:** ${{ github.event.inputs.force }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Fecha:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Listar archivos generados
          echo "#### 📁 Archivos SQLite generados:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh writable/ckan_sync/sqlite/ 2>/dev/null || echo "No hay archivos"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### 🗺️ Archivos GeoJSON generados:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh writable/ckan_sync/geojson/ 2>/dev/null || echo "No hay archivos"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Subir archivos generados
        uses: actions/upload-artifact@v3
        with:
          name: ckan-${{ github.event.inputs.resource }}-${{ github.run_number }}
          path: |
            writable/ckan_sync/sqlite/
            writable/ckan_sync/geojson/
          retention-days: 15

      - name: 📋 Subir logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs-${{ github.run_number }}
          path: writable/ckan_sync/logs/
          retention-days: 7
